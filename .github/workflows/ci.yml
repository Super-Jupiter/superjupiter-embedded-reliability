name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 tools/verify.py
      - name: Verify official Arduino linter checksum
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL https://github.com/arduino/arduino-lint/releases/download/1.3.0/arduino-lint_1.3.0_Linux_64bit.tar.gz -o arduino-lint_1.3.0_Linux_64bit.tar.gz
          curl -fsSL https://github.com/arduino/arduino-lint/releases/download/1.3.0/1.3.0-checksums.txt -o checksums.txt
          grep '  arduino-lint_1.3.0_Linux_64bit.tar.gz$' checksums.txt | sha256sum --check --strict
          tar -xzf arduino-lint_1.3.0_Linux_64bit.tar.gz
      - name: Arduino submission metadata
        run: '"$RUNNER_TEMP/arduino-lint" --compliance strict --library-manager submit --project-type library "$GITHUB_WORKSPACE"'
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: C++11 regression tests and sanitizers
        env:
          CXXFLAGS: -Wall -Wextra -Wconversion -pedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie
          LDFLAGS: -no-pie
          COMPILER: ${{ matrix.compiler }}
        run: python3 tools/verify.py --test --compiler "$COMPILER"
  boards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        board: [uno, esp32dev]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned PlatformIO in isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/pio"
          "$RUNNER_TEMP/pio/bin/python" -m pip install platformio==6.2.0
      - name: Clean packed-library Arduino-framework consumer
        env:
          BOARD: ${{ matrix.board }}
        run: '"$RUNNER_TEMP/pio/bin/python" tools/check_board.py --board "$BOARD"'
